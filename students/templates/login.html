{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="rounded-3 bg-primary bg-opacity-10 d-inline-flex p-3 mb-3">
                <i class="bi bi-shield-lock-fill fs-3 text-primary"></i>
            </div>
            <h1 class="fw-bold mb-1">Admin Login</h1>
            <p class="text-muted mb-0">Sign in to manage students</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2">
                        {% for error in form.non_field_errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
