{% extends 'base.html' %}

{% block title %}Register Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="rounded-3 bg-primary bg-opacity-10 p-3"><i class="bi bi-person-plus-fill fs-4 text-primary"></i></div>
            <div>
                <h1 class="fw-bold mb-0">Register New Student</h1>
                <p class="text-muted mb-0">Enter the student's details below</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <h6 class="text-uppercase text-muted small fw-bold mb-3">
                        <i class="bi bi-person-fill me-1"></i>Personal Information
                    </h6>
                    <div class="row g-3 mb-2">
                        <div class="col-md-6">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" maxlength="15" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" maxlength="15" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" required>
                            <div class="form-text">Emails are stored in lowercase automatically.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" name="date_of_birth" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Grade <span class="text-danger">*</span></label>
                            <select name="grade" class="form-select" required>
                                <option value="9">Grade 9</option>
                                <option value="10">Grade 10</option>
                                <option value="11">Grade 11</option>
                                <option value="12">Grade 12</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="tel" name="phone" maxlength="10" pattern="[0-9]{10}" title="Exactly 10 digits" class="form-control">
                        </div>
                    </div>

                    <hr class="my-4">

                    <h6 class="text-uppercase text-muted small fw-bold mb-3">
                        <i class="bi bi-shield-lock-fill me-1"></i>Parent/Guardian Information
                    </h6>
                    <div class="row g-3 mb-2">
                        <div class="col-md-4">
                            <label class="form-label">Parent Name</label>
                            <input type="text" name="parent_name" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Parent Email</label>
                            <input type="email" name="parent_email" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Parent Phone</label>
                            <input type="tel" name="parent_phone" maxlength="10" pattern="[0-9]{10}" title="Exactly 10 digits" class="form-control">
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Register Student
                        </button>
                        <a href="{% url 'students:student_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
